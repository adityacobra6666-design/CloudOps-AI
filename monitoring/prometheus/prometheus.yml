global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    cluster: 'cloudops-local'
    environment: 'local'

# =========================================
# ALERTMANAGER
# =========================================
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

# =========================================
# ALERT RULES
# =========================================
rule_files:
  - "/etc/prometheus/alerts.yml"

# =========================================
# OPTIONAL GRAFANA CLOUD REMOTE WRITE
# =========================================
# To forward metrics to Grafana Cloud, run Prometheus with:
#   --enable-feature=expand-env
# and uncomment the remote_write block below, or use prometheus.cloud.yml:
#
remote_write:
  - url: "${GRAFANA_CLOUD_REMOTE_WRITE_URL}"
    basic_auth:
      username: "${GRAFANA_CLOUD_USER}"
      password: "${GRAFANA_CLOUD_API_KEY}"
    queue_config:
      capacity: 2500
      max_shards: 4
      min_shards: 1
      max_samples_per_send: 500
      batch_send_deadline: 10s
      min_backoff: 1s
      max_backoff: 30s
#     write_relabel_configs:
#       - target_label: cluster
#         replacement: "cloudops-production"

# =========================================
# SCRAPE CONFIGS
# =========================================
scrape_configs:
  # CloudOps Backend Application
  - job_name: "cloudops-server"
    scrape_interval: 5s
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "server:5000"
        labels:
          service: "cloudops-server"
          tier: "backend"

  # Host Node Exporter
  - job_name: "node-exporter"
    scrape_interval: 5s
    static_configs:
      - targets:
          - "node-exporter:9100"
        labels:
          service: "node-exporter"
          tier: "infrastructure"

  # Container Advisor
  - job_name: "cadvisor"
    scrape_interval: 5s
    static_configs:
      - targets:
          - "cadvisor:8080"
        labels:
          service: "cadvisor"
          tier: "containers"