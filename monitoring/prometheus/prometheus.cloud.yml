# ==============================================================================
# CloudOps AI — Prometheus Configuration with Grafana Cloud remote_write
# ==============================================================================
# Use this configuration when streaming local / Kubernetes metrics to Grafana Cloud.
# Requires:
#   - GRAFANA_CLOUD_REMOTE_WRITE_URL (e.g. https://prometheus-prod-XX-prod-us-east-0.grafana.net/api/prom/push)
#   - GRAFANA_CLOUD_USER (numeric Instance ID, e.g. 123456)
#   - GRAFANA_CLOUD_API_KEY (Grafana Cloud Access Policy token with metrics:write)
# ==============================================================================

global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    cluster: 'cloudops-production'
    environment: 'production'

# =========================================
# ALERTMANAGER
# =========================================
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

# =========================================
# ALERT RULES
# =========================================
rule_files:
  - "/etc/prometheus/alerts.yml"

# =========================================
# GRAFANA CLOUD REMOTE WRITE
# =========================================
remote_write:
  - url: "${GRAFANA_CLOUD_REMOTE_WRITE_URL}"
    basic_auth:
      username: "${GRAFANA_CLOUD_USER}"
      password: "${GRAFANA_CLOUD_API_KEY}"
    queue_config:
      max_samples_per_send: 1000
      max_shards: 10
      capacity: 5000
    write_relabel_configs:
      - target_label: cluster
        replacement: "cloudops-production"

# =========================================
# SCRAPE CONFIGS
# =========================================
scrape_configs:
  - job_name: "cloudops-server"
    scrape_interval: 5s
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "server:5000"
        labels:
          service: "cloudops-server"
          tier: "backend"

  - job_name: "node-exporter"
    scrape_interval: 5s
    static_configs:
      - targets:
          - "node-exporter:9100"
        labels:
          service: "node-exporter"
          tier: "infrastructure"

  - job_name: "cadvisor"
    scrape_interval: 5s
    static_configs:
      - targets:
          - "cadvisor:8080"
        labels:
          service: "cadvisor"
          tier: "containers"
