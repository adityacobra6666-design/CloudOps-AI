apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudops-backend-config
  namespace: cloudops
  labels:
    app: cloudops-backend
    tier: api
data:
  NODE_ENV: "production"
  PORT: "5000"
  KUBERNETES_ENABLED: "true"
  KUBERNETES_NAMESPACE: "cloudops"
  INCIDENT_DETECTION_ENABLED: "true"
  INCIDENT_DETECTION_INTERVAL_SECONDS: "30"
  INCIDENT_CONSECUTIVE_BREACHES: "2"
  CORS_ORIGINS: "http://localhost,http://127.0.0.1,http://localhost:5173,http://localhost:3000,http://host.minikube.internal:5173"
  FRONTEND_PUBLIC_URL: "http://localhost:5173"
  # Default service discovery endpoints inside Minikube / cluster
  PROMETHEUS_URL: "http://host.minikube.internal:9090"
  OLLAMA_URL: "http://host.minikube.internal:11434"
  ALERTMANAGER_URL: "http://host.minikube.internal:9093"
  GRAFANA_URL: "http://host.minikube.internal:3000"
