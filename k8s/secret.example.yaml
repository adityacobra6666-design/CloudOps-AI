# ========================================================
# TEMPLATE ONLY — DO NOT COMMIT REAL SECRETS TO GIT
# ========================================================
# Use the secure helper script to create secrets from environment or input:
#   ./k8s/scripts/setup-secrets.sh
#
# OR run the kubectl command directly:
#   kubectl create secret generic cloudops-backend-secrets \
#     --namespace=cloudops \
#     --from-literal=MONGO_URI="mongodb+srv://<user>:<password>@cluster.mongodb.net/cloudops" \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --dry-run=client -o yaml | kubectl apply -f -
# ========================================================
apiVersion: v1
kind: Secret
metadata:
  name: cloudops-backend-secrets
  namespace: cloudops
  labels:
    app: cloudops-backend
    tier: api
type: Opaque
stringData:
  # MongoDB Connection URI (Atlas, in-cluster mongodb-dev, or host.minikube.internal)
  MONGO_URI: "mongodb://host.minikube.internal:27017/cloudops"
  # Cryptographic JWT signing key (min 32 characters)
  JWT_SECRET: "replace_with_a_secure_jwt_secret_at_least_32_characters"
  # Optional Grafana Cloud Prometheus credentials (leave commented or unset if using local)
  # GRAFANA_CLOUD_PROMETHEUS_URL: ""
  # GRAFANA_CLOUD_PROMETHEUS_USERNAME: ""
  # GRAFANA_CLOUD_PROMETHEUS_TOKEN: ""
